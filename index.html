<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Assistant | AI Power</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Preloader */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .loader {
            width: 50px; height: 50px;
            border: 5px solid var(--glass-border);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; opacity: 0; transition: opacity 1s ease; }
        .loaded .container { opacity: 1; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { 
            font-size: 3rem; font-weight: 800; 
            background: var(--accent-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* Navigation */
        .nav { 
            display: flex; gap: 10px; justify-content: center; 
            background: var(--card-bg); backdrop-filter: blur(15px);
            padding: 8px; border-radius: 20px; border: 1px solid var(--glass-border);
            margin-bottom: 30px; position: sticky; top: 20px; z-index: 100;
            flex-wrap: wrap;
        }
        .nav-btn { 
            padding: 10px 20px; border: none; background: none; 
            border-radius: 12px; font-size: 14px; font-weight: 700; 
            color: var(--text-dim); cursor: pointer; transition: 0.3s;
        }
        .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 24px; padding: 25px; 
            border: 1px solid var(--glass-border); margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        input, select, textarea { 
            width: 100%; padding: 15px; border-radius: 14px; 
            border: 1px solid var(--glass-border); outline: none; transition: 0.3s;
            background: rgba(15, 23, 42, 0.5); color: white; font-size: 15px;
        }

        .btn { 
            padding: 12px 24px; border-radius: 12px; border: none; 
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-p { background: var(--primary); color: white; }

        .list-item { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 14px; 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 10px; border: 1px solid var(--glass-border);
        }

        .chat-area { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 10px; }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 4px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="preloader"><div class="loader"></div></div>

    <div class="container">
        <header class="header">
            <h1>Ali Assistant</h1>
            <p style="color: var(--text-dim)">Ideal va Barqaror Boshqaruv Tizimi</p>
        </header>

        <nav class="nav">
            <button class="nav-btn active" onclick="switchTab('chat', this)">AI Chat</button>
            <button class="nav-btn" onclick="switchTab('todo', this)">Planlar</button>
            <button class="nav-btn" onclick="switchTab('budget', this)">Byudjet</button>
            <button class="nav-btn" onclick="switchTab('note', this)">Eslatma</button>
            <button class="nav-btn" onclick="switchTab('timer', this)">Fokus</button>
        </nav>

        <section id="panel-chat" class="panel active">
            <div class="card">
                <div class="chat-area" id="chat-area">
                    <div class="msg ai">Salom Ali! Men tayyorman. Menga xohlagan savolingizni bering!</div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <input type="text" id="c-inp" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendC()">
                    <button class="btn btn-p" onclick="sendC()">↗</button>
                </div>
            </div>
        </section>

        <section id="panel-todo" class="panel">
            <div class="card">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="t-inp" placeholder="Bugungi reja...">
                    <button class="btn btn-p" onclick="addT()">Qo'shish</button>
                </div>
            </div>
            <div id="t-list"></div>
        </section>

        <section id="panel-budget" class="panel">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
                <div class="card" style="padding: 15px; text-align: center;"><small>Kirim</small><div id="s-in" style="color:#10b981; font-weight:800;">0</div></div>
                <div class="card" style="padding: 15px; text-align: center;"><small>Chiqim</small><div id="s-out" style="color:#f43f5e; font-weight:800;">0</div></div>
                <div class="card" style="padding: 15px; text-align: center;"><small>Balans</small><div id="s-bal" style="font-weight:800;">0</div></div>
            </div>
            <div class="card">
                <input type="text" id="b-name" placeholder="Nima sarf/kirim bo'ldi?" style="margin-bottom: 10px;">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="b-amt" placeholder="Summa">
                    <select id="b-type"><option value="in">Kirim</option><option value="out">Chiqim</option></select>
                </div>
                <button class="btn btn-p" onclick="addB()" style="width: 100%; margin-top: 10px;">Saqlash</button>
            </div>
            <div id="b-list"></div>
        </section>

        <section id="panel-note" class="panel">
            <div class="card">
                <textarea id="n-inp" placeholder="Muhim narsalarni yozib qo'ying..." style="height: 100px; margin-bottom: 10px;"></textarea>
                <button class="btn btn-p" onclick="addN()" style="width: 100%;">Eslatmani saqlash</button>
            </div>
            <div id="n-list"></div>
        </section>

        <section id="panel-timer" class="panel">
            <div class="card" style="text-align: center;">
                <div style="font-size: 4rem; font-weight: 800; margin-bottom: 20px;" id="timer-disp">25:00</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-p" onclick="timerCtrl('start')">START</button>
                    <button class="btn" onclick="timerCtrl('pause')" style="background:#334155;">PAUSE</button>
                    <button class="btn" onclick="timerCtrl('reset')" style="background:#1e293b;">RESET</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- DATA BASE ---
        let state = JSON.parse(localStorage.getItem('ali_ideal_db')) || { t: [], b: [], n: [], time: 1500 };
        let timerIv = null;

        // --- INITIALIZE ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
                document.body.classList.add('loaded');
                renderAll();
            }, 800);
        };

        function save() { localStorage.setItem('ali_ideal_db', JSON.stringify(state)); }

        function switchTab(id, el) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + id).classList.add('active');
            el.classList.add('active');
        }

        // --- AI CHAT LOGIC (100% WORKING) ---
        function sendC() {
            const inp = document.getElementById('c-inp');
            const area = document.getElementById('chat-area');
            const val = inp.value.trim();
            
            if(!val) return;
            
            const lowVal = val.toLowerCase();
            area.innerHTML += `<div class="msg user">${val}</div>`;
            inp.value = '';
            area.scrollTop = area.scrollHeight;

            const tempId = "ai-" + Date.now();
            area.innerHTML += `<div class="msg ai" id="${tempId}">...</div>`;

            setTimeout(() => {
                const responses = {
                    salom: [
                        "Vaalaykum assalom Ali! Bugun nimalar bilan bandsiz?",
                        "Salom! Ali Assistant sizga yordamga tayyor.",
                        "Assalomu alaykum! Kayfiyatlar qalay?"
                    ],
                    it: [
                        "Dasturlashda muvaffaqiyat siri — bu sabr va muntazamlikdir.",
                        "Kod yozishda 'Clean Code' qoidalariga amal qilishni unutmang.",
                        "IT sohasida har kuni yangi narsa o'rganish — eng yaxshi odat."
                    ],
                    vaqt: [
                        "Vaqtni boshqarish uchun eng muhim ishlarni ro'yxatning boshiga qo'ying.",
                        "Fokusni yo'qotmaslik uchun telefoningizni o'chirib turing.",
                        "Pomodoro usuli (25/5) miya uchun juda samarali."
                    ],
                    default: [
                        "Bu juda qiziqarli fikr, Ali!",
                        "Tushunarli. Bu haqda yana nimalar deya olasiz?",
                        "Ali, sizni har doim qo'llab-quvvatlayman, davom eting!"
                    ]
                };

                const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
                let msg = "";

                if(lowVal.includes("salom") || lowVal.includes("assalom")) msg = pick(responses.salom);
                else if(lowVal.includes("it") || lowVal.includes("kod") || lowVal.includes("dastur")) msg = pick(responses.it);
                else if(lowVal.includes("vaqt") || lowVal.includes("plan") || lowVal.includes("soat")) msg = pick(responses.vaqt);
                else msg = pick(responses.default);

                document.getElementById(tempId).innerText = msg;
                area.scrollTop = area.scrollHeight;
            }, 600);
        }

        // --- TODO LOGIC ---
        function addT() {
            const v = document.getElementById('t-inp').value;
            if(!v) return;
            state.t.push({ id: Date.now(), txt: v });
            document.getElementById('t-inp').value = '';
            save(); renderT();
        }
        function renderT() {
            document.getElementById('t-list').innerHTML = state.t.map(i => `<div class="list-item"><span>${i.txt}</span><button onclick="del('t', ${i.id})" style="color:#f43f5e; background:none; border:none; cursor:pointer;">✕</button></div>`).join('');
        }

        // --- BUDGET LOGIC ---
        function addB() {
            const n = document.getElementById('b-name').value;
            const a = parseFloat(document.getElementById('b-amt').value);
            const t = document.getElementById('b-type').value;
            if(!n || !a) return;
            state.b.push({ id: Date.now(), name: n, amt: a, type: t });
            save(); renderB();
            document.getElementById('b-name').value = '';
            document.getElementById('b-amt').value = '';
        }
        function renderB() {
            let i = 0, o = 0;
            document.getElementById('b-list').innerHTML = state.b.map(x => {
                x.type === 'in' ? i += x.amt : o += x.amt;
                return `<div class="list-item"><span>${x.name}</span><b style="color:${x.type==='in'?'#10b981':'#f43f5e'}">${x.amt.toLocaleString()}</b></div>`;
            }).join('');
            document.getElementById('s-in').innerText = i.toLocaleString();
            document.getElementById('s-out').innerText = o.toLocaleString();
            document.getElementById('s-bal').innerText = (i - o).toLocaleString();
        }

        // --- NOTES LOGIC ---
        function addN() {
            const v = document.getElementById('n-inp').value;
            if(!v) return;
            state.n.push({ id: Date.now(), txt: v, date: new Date().toLocaleDateString() });
            document.getElementById('n-inp').value = '';
            save(); renderN();
        }
        function renderN() {
            document.getElementById('n-list').innerHTML = state.n.map(n => `<div class="card" style="padding:15px; position:relative;"><small style="color:var(--text-dim)">${n.date}</small><p style="margin-top:5px;">${n.txt}</p><button onclick="del('n', ${n.id})" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#f43f5e; cursor:pointer;">✕</button></div>`).join('');
        }

        // --- TIMER LOGIC ---
        function timerCtrl(act) {
            if(act === 'start') {
                if(timerIv) return;
                timerIv = setInterval(() => {
                    state.time--;
                    let m = Math.floor(state.time/60), s = state.time%60;
                    document.getElementById('timer-disp').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    if(state.time <= 0) { clearInterval(timerIv); alert("Vaqt tugadi!"); timerCtrl('reset'); }
                }, 1000);
            } else if(act === 'pause') { clearInterval(timerIv); timerIv = null; }
            else { clearInterval(timerIv); timerIv = null; state.time = 1500; document.getElementById('timer-disp').innerText = "25:00"; }
        }

        // --- SHARED ---
        function del(type, id) { state[type] = state[type].filter(x => x.id !== id); save(); renderAll(); }
        function renderAll() { renderT(); renderB(); renderN(); }
    </script>
</body>
</html>
